[build-system]
# Pinned build backend. scikit-build-core drives CMake and Ninja; CMake pulls
# nanobind and the other C++ dependencies itself (see cmake/Dependencies.cmake).
requires = ["scikit-build-core==1.1.2"]
build-backend = "scikit_build_core.build"

[project]
name = "dfm-native"
version = "0.1.0"
description = "Native C++ engine for the Differometor optical simulator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "numpy==2.5.5",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["python/dfm_native"]
sdist.include = [
  "CMakeLists.txt",
  "cmake/*.cmake",
  "include/**",
  "src/**",
  "bindings/**",
  "python/**",
  "tests/**",
]
